spring:
  application:
    name: cotato-networking

  datasource:
    url: jdbc:mysql://localhost:3306/cotato_networking?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true           # 쿼리 포맷팅 (가독성)
        default_batch_fetch_size: 100   # N+1 방지를 위한 IN 절 배치 사이즈
    show-sql: true

  jackson:
    time-zone: Asia/Seoul

# Swagger UI 경로 설정
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE   # 바인딩 파라미터 로깅
