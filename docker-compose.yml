services:
  db:
    image: mysql:8.0
    container_name: cotato-db
    environment:
      MYSQL_DATABASE: ${DB_NAME:-cotato_networking}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - cotato-network

  app:
    image: ${DOCKER_IMAGE:-cotato-backend:latest}
    container_name: cotato-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_NAME: ${DB_NAME:-cotato_networking}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:8080"
    restart: always
    networks:
      - cotato-network

volumes:
  mysql-data:

networks:
  cotato-network:
    driver: bridge
